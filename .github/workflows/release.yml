name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm test
      - run: npm run smoke
      - name: Tag must match the skill's versions
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./session-story/package.json').version")"
          skill="$(sed -n 's/^  version: "\(.*\)"$/\1/p' session-story/SKILL.md)"
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$skill" ]; then
            echo "::error::tag v$tag, session-story/package.json $pkg and SKILL.md $skill must match"
            exit 1
          fi
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
